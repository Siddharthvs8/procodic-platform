upstream procodic_web { server web:3000; }
upstream procodic_api { server api:4000; }
limit_req_zone $binary_remote_addr zone=lead_submissions:10m rate=8r/m;
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;

server {
  listen 80;
  server_name _;
  client_max_body_size 90m;

  location /api/ {
    proxy_pass http://procodic_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location = /api/leads {
    limit_req zone=lead_submissions burst=4 nodelay;
    proxy_pass http://procodic_api/api/leads;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/auth/login {
    limit_req zone=admin_login burst=5 nodelay;
    proxy_pass http://procodic_api/api/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://procodic_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
